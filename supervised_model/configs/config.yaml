general:
  - logger: logger
  - model: supervised_v1.0
  - optimizer: adam
  - criteria: criteria

wandb_logger:
  - enabled: true
  - project: BernieExperiments


model:
  name: "supervised_naive"
  base_model: 'PEM'

criteria:
  - mse_folded_unfolded
  - energy_by_structure

optimizer:
  name: "adam"
  lr: 0.0001

training:
  split_size: 0.2
  single_protein_batch_size: 32
  num_epochs: 20
  freeze_pretrained: true
  pretrained_ckpt_path: "../model_outputs/trianed_models_th_mix_100/"
  trained_ckpt_path: '../model_outputs/supervised/'
